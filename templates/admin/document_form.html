{% extends "admin/base_admin.html" %}
{% set active = 'documents' %}

{% block title %}Загрузка документа — Панель администратора{% endblock %}

{% block admin_content %}
    <h1 class="h4 mb-4">Загрузка документа</h1>

    <form method="post" enctype="multipart/form-data" class="card p-4">
        <div class="mb-3">
            <label for="title" class="form-label">Название документа</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="doc_category" class="form-label">Категория</label>
                <select class="form-select" id="doc_category" name="doc_category">
                    <option value="">—</option>
                    {% for choice in category_choices %}
                        <option value="{{ choice }}">{{ choice }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="section_id" class="form-label">Раздел</label>
                <select class="form-select" id="section_id" name="section_id">
                    <option value="">—</option>
                </select>
                <div class="form-text">Список зависит от выбранной категории.</div>
            </div>
        </div>
        <div class="mb-3">
            <label for="file" class="form-label">Файл (PDF, DOCX)</label>
            <input type="file" class="form-control" id="file" name="file" accept=".pdf,.docx" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Загрузить</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('admin.documents_list') }}">Отмена</a>
        </div>
    </form>

    <script>
        (function () {
            var sectionsByCategory = {{ sections_by_category|tojson }};
            var categorySelect = document.getElementById('doc_category');
            var sectionSelect = document.getElementById('section_id');

            function rebuildSections() {
                sectionSelect.innerHTML = '';
                var blank = document.createElement('option');
                blank.value = '';
                blank.textContent = '—';
                sectionSelect.appendChild(blank);
                (sectionsByCategory[categorySelect.value] || []).forEach(function (s) {
                    var opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name;
                    sectionSelect.appendChild(opt);
                });
            }

            categorySelect.addEventListener('change', rebuildSections);
            rebuildSections();
        })();
    </script>
{% endblock %}
