{% extends "base.html" %}

{% block title %}Регистрация региональной федерации{% endblock %}

{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-7">
                <h1 class="h4 mb-4 text-center">Регистрация региональной федерации</h1>
                <form method="post" class="card p-4">
                    <h2 class="h6 mb-3">Данные федерации</h2>
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Полное наименование федерации</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" required
                               value="{{ form.full_name if form else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="short_name" class="form-label">Краткое наименование федерации</label>
                        <input type="text" class="form-control" id="short_name" name="short_name"
                               value="{{ form.short_name if form else '' }}">
                    </div>

                    <h2 class="h6 mb-3 mt-4">Руководитель федерации</h2>
                    <div class="mb-3">
                        <label for="leader_full_name" class="form-label">ФИО руководителя спортивной федерации</label>
                        <input type="text" class="form-control" id="leader_full_name" name="leader_full_name" required
                               value="{{ form.leader_full_name if form else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="leader_position" class="form-label">Должность</label>
                        <input type="text" class="form-control" id="leader_position" name="leader_position"
                               value="{{ form.leader_position if form else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Телефон</label>
                        <input type="text" class="form-control" id="phone" name="phone"
                               value="{{ form.phone if form else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Электронный адрес</label>
                        <input type="email" class="form-control" id="email" name="email" required
                               value="{{ form.email if form else '' }}">
                        <div class="form-text">Электронный адрес будет логином для входа на сайт.</div>
                    </div>

                    <h2 class="h6 mb-3 mt-4">Пароль</h2>
                    <div class="mb-3">
                        <label for="password" class="form-label">Придумайте пароль для входа на сайт</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="password2" class="form-label">Повторите пароль для входа на сайт</label>
                        <input type="password" class="form-control" id="password2" name="password2" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                    <a href="{{ url_for('admin.login') }}" class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
