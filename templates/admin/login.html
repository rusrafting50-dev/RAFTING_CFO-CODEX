{% extends "base.html" %}

{% block title %}Вход в панель администратора{% endblock %}

{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5">
                <h1 class="h4 mb-4 text-center">Вход в панель администратора</h1>
                <form method="post" class="card p-4">
                    <div class="mb-3">
                        <label for="username" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                    <div class="d-flex justify-content-between mt-3 small">
                        <a href="{{ url_for('admin.forgot_password') }}">Забыли пароль?</a>
                        <a href="{{ url_for('admin.register') }}">Зарегистрироваться</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
