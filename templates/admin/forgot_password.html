{% extends "base.html" %}

{% block title %}Забыли пароль{% endblock %}

{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5">
                <h1 class="h4 mb-4 text-center">Забыли пароль?</h1>
                <p class="text-muted text-center">Укажите логин или email, указанный при регистрации — заявка на сброс пароля будет передана администратору.</p>
                <form method="post" class="card p-4">
                    <div class="mb-3">
                        <label for="username_or_email" class="form-label">Логин или email</label>
                        <input type="text" class="form-control" id="username_or_email" name="username_or_email" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Отправить заявку</button>
                    <a href="{{ url_for('admin.login') }}" class="btn btn-outline-secondary w-100 mt-2">Отмена</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
