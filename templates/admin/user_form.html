{% extends "admin/base_admin.html" %}
{% set active = 'users' %}

{% block title %}Новый пользователь — Панель администратора{% endblock %}

{% block admin_content %}
    <h1 class="h4 mb-4">Новый пользователь</h1>

    <form method="post" class="card p-4">
        <div class="mb-3">
            <label for="username" class="form-label">Логин</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Роль</label>
            <select class="form-select" id="role" name="role">
                {% for choice in role_choices %}
                    <option value="{{ choice }}" {{ 'selected' if choice == 'viewer' }}>{{ choice }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Создать</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('admin.users_list') }}">Отмена</a>
        </div>
    </form>
{% endblock %}
