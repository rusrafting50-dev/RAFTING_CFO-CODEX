{% extends "admin/base_admin.html" %}
{% set active = 'news' %}

{% block title %}{{ 'Редактирование новости' if news else 'Новая новость' }} — Панель администратора{% endblock %}

{% block admin_content %}
    <h1 class="h4 mb-4">{{ 'Редактирование новости' if news else 'Новая новость' }}</h1>

    <form method="post" class="card p-4">
        <div class="mb-3">
            <label for="title" class="form-label">Заголовок</label>
            <input type="text" class="form-control" id="title" name="title" required
                   value="{{ news.title if news else '' }}">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Текст новости</label>
            <textarea class="form-control" id="content" name="content" rows="6" required>{{ news.content if news else '' }}</textarea>
        </div>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="category" class="form-label">Категория</label>
                <select class="form-select" id="category" name="category">
                    <option value="">—</option>
                    {% for choice in category_choices %}
                        <option value="{{ choice }}" {{ 'selected' if news and news.category == choice }}>{{ choice }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="level" class="form-label">Уровень</label>
                <select class="form-select" id="level" name="level">
                    <option value="">—</option>
                    {% for choice in level_choices %}
                        <option value="{{ choice }}" {{ 'selected' if news and news.level == choice }}>{{ choice }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="is_published" name="is_published"
                   {{ 'checked' if news and news.is_published }}>
            <label class="form-check-label" for="is_published">Опубликовать сразу</label>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('admin.news_list') }}">Отмена</a>
        </div>
    </form>
{% endblock %}
